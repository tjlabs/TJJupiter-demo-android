name: Verify And Bump Jupiter SDK

on:
  repository_dispatch:
    types: [sdk-released]
  workflow_dispatch:
    inputs:
      version:
        description: "Target Jupiter SDK version (e.g. 2.0.18)"
        required: true
        type: string
      providers:
        description: "Comma-separated providers to verify (e.g. GCP or GCP,AWS)"
        required: false
        type: string
        default: "GCP"
      regions:
        description: "Comma-separated regions to verify (e.g. KOREA,SAUDI)"
        required: false
        type: string
        default: "KOREA,SAUDI"
      sector_id:
        description: "Fallback sector_id used when a region has no entry in sector_ids"
        required: false
        type: string
        default: "20"
      sector_ids:
        description: 'Per-region sector_id JSON map (e.g. {"KOREA":"20","SAUDI":"112"}). Overrides sector_id per region.'
        required: false
        type: string
        default: '{"KOREA":"20","SAUDI":"112"}'

permissions:
  contents: write

concurrency:
  group: verify-and-bump-${{ github.event.client_payload.version || inputs.version }}
  cancel-in-progress: false

jobs:
  resolve-inputs:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
      providers: ${{ steps.set.outputs.providers }}
      regions: ${{ steps.set.outputs.regions }}
      sector_ids: ${{ steps.set.outputs.sector_ids }}
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Resolve inputs
        id: set
        shell: bash
        # GitHub Actions expression 결과를 env 로 넘겨야 JSON 내부의 큰따옴표가 bash 파싱에 깨지지 않는다.
        env:
          VERSION_IN: ${{ github.event.client_payload.version || inputs.version }}
          PROVIDERS_IN: ${{ github.event.client_payload.providers || inputs.providers || 'GCP' }}
          REGIONS_IN: ${{ github.event.client_payload.regions || inputs.regions || 'KOREA,SAUDI' }}
          SECTOR_ID_FALLBACK_IN: ${{ github.event.client_payload.sector_id || inputs.sector_id || '20' }}
          SECTOR_IDS_JSON_IN: ${{ github.event.client_payload.sector_ids || inputs.sector_ids || '{"KOREA":"20","SAUDI":"112"}' }}
        run: |
          VERSION="$VERSION_IN"
          PROVIDERS="$PROVIDERS_IN"
          REGIONS="$REGIONS_IN"
          SECTOR_ID_FALLBACK="$SECTOR_ID_FALLBACK_IN"
          # Per-region sector_id JSON map. Falls back to SECTOR_ID_FALLBACK if a region has no entry.
          SECTOR_IDS_JSON="$SECTOR_IDS_JSON_IN"

          if [[ -z "$VERSION" ]]; then
            echo "::error::version is required"
            exit 1
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid semver: $VERSION"
            exit 1
          fi

          # Build matrix JSON with region-specific secret names and per-region sector_id.
          MATRIX=$(python3 - <<PY
          import json, os
          providers = [p.strip() for p in "$PROVIDERS".split(",") if p.strip()]
          regions = [r.strip() for r in "$REGIONS".split(",") if r.strip()]
          fallback_sector = "$SECTOR_ID_FALLBACK"
          try:
              sector_map = json.loads(r'''$SECTOR_IDS_JSON''')
              if not isinstance(sector_map, dict):
                  raise ValueError("sector_ids must be a JSON object")
          except Exception as e:
              raise SystemExit(f"::error::Invalid sector_ids JSON: {e}")
          combos = [
              {
                  "provider": p,
                  "region": r,
                  "sector_id": str(sector_map.get(r.upper(), fallback_sector)),
                  "auth_access_key_secret": f"AUTH_ACCESS_KEY_{r.upper()}",
                  "auth_secret_access_key_secret": f"AUTH_SECRET_ACCESS_KEY_{r.upper()}",
              }
              for p in providers
              for r in regions
          ]
          print(json.dumps({"include": combos}))
          PY
          )

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "providers=$PROVIDERS" >> "$GITHUB_OUTPUT"
          echo "regions=$REGIONS" >> "$GITHUB_OUTPUT"
          echo "sector_ids=$SECTOR_IDS_JSON" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

          echo "Resolved version=$VERSION providers=$PROVIDERS regions=$REGIONS sector_ids=$SECTOR_IDS_JSON"
          echo "Matrix: $MATRIX"

  verify:
    needs: resolve-inputs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-inputs.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Override JUPITER_SDK_VERSION to release tag
        shell: bash
        run: |
          VERSION="${{ needs.resolve-inputs.outputs.version }}"
          sed -i "s/^JUPITER_SDK_VERSION=.*/JUPITER_SDK_VERSION=${VERSION}/" gradle.properties
          grep '^JUPITER_SDK_VERSION=' gradle.properties

      - name: Validate region secrets (${{ matrix.provider }} / ${{ matrix.region }})
        env:
          AUTH_ACCESS_KEY: ${{ secrets[matrix.auth_access_key_secret] }}
          AUTH_SECRET_ACCESS_KEY: ${{ secrets[matrix.auth_secret_access_key_secret] }}
        shell: bash
        run: |
          if [[ -z "$AUTH_ACCESS_KEY" ]]; then
            echo "::error::Missing GitHub secret: ${{ matrix.auth_access_key_secret }}"
            exit 1
          fi
          if [[ -z "$AUTH_SECRET_ACCESS_KEY" ]]; then
            echo "::error::Missing GitHub secret: ${{ matrix.auth_secret_access_key_secret }}"
            exit 1
          fi

      - name: Run androidTest on emulator (${{ matrix.provider }} / ${{ matrix.region }})
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ORG_GRADLE_PROJECT_AUTH_ACCESS_KEY: ${{ secrets[matrix.auth_access_key_secret] }}
          ORG_GRADLE_PROJECT_AUTH_SECRET_ACCESS_KEY: ${{ secrets[matrix.auth_secret_access_key_secret] }}
        with:
          api-level: 30
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: >-
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.tjlabs.tjjupiterdemo.JupiterAuthInitTest
            -Pandroid.testInstrumentationRunnerArguments.provider=${{ matrix.provider }}
            -Pandroid.testInstrumentationRunnerArguments.region=${{ matrix.region }}
            -Pandroid.testInstrumentationRunnerArguments.sectorId=${{ matrix.sector_id }}
            --stacktrace

      - name: Run mock mode androidTest on emulator (${{ matrix.provider }} / ${{ matrix.region }})
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ORG_GRADLE_PROJECT_AUTH_ACCESS_KEY: ${{ secrets[matrix.auth_access_key_secret] }}
          ORG_GRADLE_PROJECT_AUTH_SECRET_ACCESS_KEY: ${{ secrets[matrix.auth_secret_access_key_secret] }}
        with:
          api-level: 30
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: >-
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.tjlabs.tjjupiterdemo.JupiterMockModeTest
            -Pandroid.testInstrumentationRunnerArguments.provider=${{ matrix.provider }}
            -Pandroid.testInstrumentationRunnerArguments.region=${{ matrix.region }}
            -Pandroid.testInstrumentationRunnerArguments.sectorId=${{ matrix.sector_id }}
            --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-report-${{ matrix.provider }}-${{ matrix.region }}-sector${{ matrix.sector_id }}
          path: app/build/reports/androidTests/connected/**
          if-no-files-found: ignore

  bump:
    needs: [resolve-inputs, verify]
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.pr.outputs.branch }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create release branch
        id: branch
        shell: bash
        run: |
          VERSION="${{ needs.resolve-inputs.outputs.version }}"
          BRANCH="release/${VERSION}"
          if git ls-remote --exit-code origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "::error::Branch ${BRANCH} already exists on origin"
            exit 1
          fi
          git checkout -b "${BRANCH}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Bump JUPITER_SDK_VERSION in gradle.properties
        shell: bash
        run: |
          VERSION="${{ needs.resolve-inputs.outputs.version }}"
          sed -i "s/^JUPITER_SDK_VERSION=.*/JUPITER_SDK_VERSION=${VERSION}/" gradle.properties
          grep '^JUPITER_SDK_VERSION=' gradle.properties

      - name: Sync README via Gradle task
        run: ./gradlew :app:syncReadmeJupiterVersion

      - name: Commit & push
        id: pr
        shell: bash
        run: |
          VERSION="${{ needs.resolve-inputs.outputs.version }}"
          BRANCH="${{ steps.branch.outputs.branch }}"
          git add gradle.properties README.md
          if git diff --cached --quiet; then
            echo "::warning::No changes to commit (already on ${VERSION}?)"
            echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: bump Jupiter SDK to ${VERSION}"
          git push -u origin "${BRANCH}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

  notify:
    needs: [resolve-inputs, verify, bump]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack (Success)
        if: ${{ needs.verify.result == 'success' && needs.bump.result == 'success' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        shell: bash
        run: |
          if [[ -z "${SLACK_WEBHOOK_URL}" ]]; then
            echo "SLACK_WEBHOOK_URL is not set. Skip Slack notification."
            exit 0
          fi
          VERSION="${{ needs.resolve-inputs.outputs.version }}"
          PROVIDERS="${{ needs.resolve-inputs.outputs.providers }}"
          REGIONS="${{ needs.resolve-inputs.outputs.regions }}"
          SECTOR_IDS="${{ needs.resolve-inputs.outputs.sector_ids }}"
          BRANCH="${{ needs.bump.outputs.branch }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          payload=$(cat <<EOF
          {
            "text": "✅ Jupiter demo 검증 & README bump 완료\n- repo: ${{ github.repository }}\n- version: ${VERSION}\n- verified: providers=${PROVIDERS}, regions=${REGIONS}, sector_ids=${SECTOR_IDS}\n- branch: ${BRANCH}\n- run: ${RUN_URL}"
          }
          EOF
          )
          curl -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"

      - name: Notify Slack (Failure)
        if: ${{ needs.verify.result != 'success' || needs.bump.result == 'failure' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        shell: bash
        run: |
          if [[ -z "${SLACK_WEBHOOK_URL}" ]]; then
            echo "SLACK_WEBHOOK_URL is not set. Skip Slack notification."
            exit 0
          fi
          VERSION="${{ needs.resolve-inputs.outputs.version }}"
          PROVIDERS="${{ needs.resolve-inputs.outputs.providers }}"
          REGIONS="${{ needs.resolve-inputs.outputs.regions }}"
          SECTOR_IDS="${{ needs.resolve-inputs.outputs.sector_ids }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          payload=$(cat <<EOF
          {
            "text": "❌ Jupiter demo 검증 실패\n- repo: ${{ github.repository }}\n- version: ${VERSION}\n- target: providers=${PROVIDERS}, regions=${REGIONS}, sector_ids=${SECTOR_IDS}\n- verify=${{ needs.verify.result }}, bump=${{ needs.bump.result }}\n- run: ${RUN_URL}"
          }
          EOF
          )
          curl -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
